services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liarapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liarapilot_local}
      POSTGRES_DB: liarapilot
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liarapilot -d liarapilot"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
